name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - "scripts/container_publish_policy.py"
      - "scripts/test_container_publish_policy.py"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "scripts/test_image_fixture.py"
      - "scripts/test_image_fixture.sh"
      - "scripts/test_image_fixture_errors.sh"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Read-only by default; each job requests the registry/SARIF/OIDC scopes it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.RUST_TEMPLATE_DOCKERHUB_NAMESPACE || 'threatflux' }}
  PUBLISH_DOCKERHUB: ${{ vars.RUST_TEMPLATE_PUBLISH_DOCKERHUB || 'false' }}
  DOCKER_BUILDKIT: 1
  BINARY_NAME: ${{ vars.RUST_TEMPLATE_BINARY_NAME || 'unifi-cli' }}
  BINARY_PACKAGE: ${{ vars.RUST_TEMPLATE_BINARY_PACKAGE || '' }}
  SBOM_MANIFEST_PATH: ${{ vars.RUST_TEMPLATE_SBOM_MANIFEST_PATH || 'Cargo.toml' }}

jobs:
  build:
    name: Build Docker Image
    # Auto Release (threatflux-automation GitHub App) pushes its
    # "chore: release vX.Y.Z" version-bump commit to main and then tags that
    # same commit, and both pushes start this workflow. The tag run publishes
    # the commit with its version tags, the commit SHA tag and latest, so the
    # branch run for the release commit is skipped. Otherwise two builds of one
    # commit, with different digests, would race for the SHA and latest tags.
    # Every other job needs this one and is skipped with it.
    if: >-
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'chore: release v'))
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      base_digest: ${{ steps.base_build.outputs.digest }}
      rust_version: ${{ steps.rust_toolchain.outputs.version }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
      # A flag, not the docker.io reference: GitHub drops a job output that
      # contains a secret's value, and the Docker Hub namespace can equal
      # DOCKERHUB_USERNAME, so the sign job rebuilds the reference itself.
      dockerhub_enabled: ${{ steps.dockerhub.outputs.enabled == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release image source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container_publish_policy.py --validate

      - name: Lowercase image name
        id: lowercase
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repo name
        id: dockerhub_repo
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Detect Rust toolchain version
        id: rust_toolchain
        run: |
          TOOLCHAIN_VERSION="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          if [[ -z "${TOOLCHAIN_VERSION}" ]]; then
            echo "::error::Unable to detect Rust toolchain version from rust-toolchain.toml"
            exit 1
          fi
          echo "version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Select build platforms
        id: platforms
        run: |
          echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          echo "needs_qemu=true" >> "$GITHUB_OUTPUT"

      # GHCR is the primary registry. Docker Hub is opt-in: set the
      # RUST_TEMPLATE_PUBLISH_DOCKERHUB variable to 'true' (see README,
      # "Container image"). Only this step reads the Docker Hub secrets, and it
      # runs only when the variable is 'true', so with publishing off no
      # executed step reads them and no docker.io tag is generated.
      - name: Check Docker Hub publishing
        id: dockerhub
        if: github.event_name != 'pull_request' && env.PUBLISH_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::warning::RUST_TEMPLATE_PUBLISH_DOCKERHUB is 'true' but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not available to this repository; publishing to GHCR only"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Resolve image targets
        id: image_targets
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ steps.dockerhub_repo.outputs.name }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        run: |
          {
            echo "images<<EOF"
            echo "${GHCR_IMAGE}"
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Docker Hub publishing: ${DOCKERHUB_ENABLED}"

      - name: Set up QEMU
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          version: v0.39.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image_targets.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=sha,format=long,prefix=
      - name: Extract base image metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image_targets.outputs.images }}
          flavor: latest=false
          tags: |
            type=raw,value=base-${{ github.sha }}
            type=raw,value=base-rust-${{ steps.rust_toolchain.outputs.version }}-${{ github.sha }}
      - name: Build base image
        id: base_build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rust-base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}

      - name: Build and export (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.lowercase.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}

      - name: Build and push runtime image (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}

      # The runtime image is distroless (no shell), so the CLI itself is the
      # smoke test: it must start, print its version and help, and run as a
      # non-root user. PRs test the exported amd64 image before merge; pushes
      # test every pushed platform by digest (QEMU runs the non-native ones).
      - name: Smoke test image
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_IMAGE: ${{ steps.lowercase.outputs.image_name }}:scan
          PUSHED_IMAGE: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}@${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ steps.platforms.outputs.value }}
        run: |
          set -euo pipefail
          # Verify startup, nonroot identity and DNS/TLS/controller behavior.
          smoke_test() {
            local platform="$1" image="$2" container user
            echo "::group::Smoke test ${platform}"
            docker run --rm --platform "${platform}" "${image}" --version
            docker run --rm --platform "${platform}" "${image}" --help > /dev/null
            # Read USER from a container of this platform: inspecting a
            # multi-platform reference can report another platform's config.
            container="$(docker create --platform "${platform}" "${image}")"
            user="$(docker container inspect --format '{{.Config.User}}' "${container}")"
            docker rm "${container}" > /dev/null
            if [[ -z "${user}" || "${user%%:*}" == "0" || "${user%%:*}" == "root" ]]; then
              echo "::error::${image} (${platform}) runs as root (USER '${user}')"
              exit 1
            fi
            bash scripts/test_image_fixture_errors.sh "${image}" "${platform}"
            bash scripts/test_image_fixture.sh "${image}" "${platform}"
            echo "Runs as USER ${user}"
            echo "::endgroup::"
          }
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            docker load -i /tmp/image.tar
            smoke_test linux/amd64 "${PR_IMAGE}"
          else
            IFS=',' read -ra platforms <<< "${PLATFORMS}"
            for platform in "${platforms[@]}"; do
              smoke_test "${platform}" "${PUSHED_IMAGE}"
              # The runner's classic image store keeps one platform per
              # reference and refuses to pull another platform over the same
              # index digest ("cannot overwrite digest"), so drop this one
              # before the next platform is pulled.
              docker image rm "${PUSHED_IMAGE}" > /dev/null
            done
          fi

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Security Scan
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: docker load -i /tmp/image.tar

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        run: docker pull ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          exit-code: "1"
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}@{2}', env.REGISTRY, needs.build.outputs.image_name, needs.build.outputs.digest) }}
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''

  sign:
    name: Sign Container
    needs: [build, scan]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # Runs only when the build pushed to Docker Hub. cosign pushes the
      # signature next to the image, so it needs the Read & Write token.
      - name: Log in to Docker Hub
        if: needs.build.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same multi-arch digest as GHCR, signed keylessly by this workflow,
      # so both registries carry a signature with one certificate identity.
      - name: Sign Docker Hub image
        if: needs.build.outputs.dockerhub_enabled == 'true'
        env:
          COSIGN_EXPERIMENTAL: 1
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          cosign sign --yes "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${repo_name,,}@${DIGEST}"

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request'
    # Read-only: pull the pushed image from GHCR and keep the SBOM as a workflow artifact.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          upload-release-assets: false
          syft-version: v1.57.1
          image: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
          artifact-name: sbom.spdx.json
          format: spdx-json
          # Attaching to a GitHub Release needs contents: write; release.yml
          # attaches the release SBOMs, so this job keeps a workflow artifact.

  promote:
    name: Promote verified container aliases
    needs: [build, scan, sign, sbom]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    concurrency:
      group: container-alias-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the already built and scanned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          version: v0.39.0

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.build.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-evaluate refs and promote only the verified digests
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
          BASE_DIGEST: ${{ needs.build.outputs.base_digest }}
          RUST_VERSION: ${{ needs.build.outputs.rust_version }}
          DOCKERHUB_ENABLED: ${{ needs.build.outputs.dockerhub_enabled }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$BASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RUST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # The concurrency lock covers this fresh decision and all promotions.
          # A historical retry cannot finish after a newer promotion and rewind it.
          python3 scripts/container_publish_policy.py > "$RUNNER_TEMP/alias-policy.json"
          mapfile -t runtime_aliases < <(jq -r '.runtime[]' "$RUNNER_TEMP/alias-policy.json")
          base_aliases=()
          if [[ "$(jq -r .base "$RUNNER_TEMP/alias-policy.json")" == true ]]; then
            base_aliases=("base-rust-$RUST_VERSION" base-rust-latest)
          fi
          images=("$REGISTRY/$IMAGE_NAME")
          if [[ "$DOCKERHUB_ENABLED" == true ]]; then
            images+=("$DOCKERHUB_REGISTRY/$DOCKERHUB_NAMESPACE/${IMAGE_NAME##*/}")
          fi
          for image in "${images[@]}"; do
            for alias in "${runtime_aliases[@]}"; do
              docker buildx imagetools create --tag "$image:$alias" "$image@$DIGEST"
              actual="$(docker buildx imagetools inspect "$image:$alias" --format '{{.Manifest.Digest}}')"
              [[ "$actual" == "$DIGEST" ]]
            done
            for alias in "${base_aliases[@]}"; do
              docker buildx imagetools create --tag "$image:$alias" "$image@$BASE_DIGEST"
              actual="$(docker buildx imagetools inspect "$image:$alias" --format '{{.Manifest.Digest}}')"
              [[ "$actual" == "$BASE_DIGEST" ]]
            done
          done
