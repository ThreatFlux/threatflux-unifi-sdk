name: Auto Release

concurrency:
  # Dry runs get their own group so they never cancel a real release run.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without creating a commit, tag, release or downstream dispatch
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # inputs.* is empty for workflow_run events, so automatic runs stay real.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The release commit and tag are pushed with a threatflux-automation
      # GitHub App installation token. An App-pushed tag is an ordinary push,
      # so release.yml and docker.yml start from their own `push: tags`
      # triggers and the reusable workflow dispatches nothing
      # (dispatch-on-app-token stays false, which avoids running them twice).
      # The dispatch list below only applies if the release falls back to
      # GITHUB_TOKEN, whose tag push starts no workflows.
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
      dispatch-workflows: release.yml,docker.yml
      dispatch-version-workflow: release.yml
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
