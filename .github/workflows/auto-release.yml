name: Auto Release

concurrency:
  # Dry runs get their own group so they never cancel a real release run.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without creating a commit, tag, release or downstream dispatch
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Verify reviewed release source
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.dry_run || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.source.outputs.authorized }}
      graduate: ${{ steps.source.outputs.graduate }}
    steps:
      - name: Checkout protected main
        if: '!inputs.dry_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize the pinned candidate
        id: source
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_APP_ID: ${{ vars.TF_AUTOMATION_APP_ID }}
          EXPECTED_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$AUTOMATION_APP_ID" ]]; then
            echo "::error::Reviewed releases require the ThreatFlux automation App"
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$SOURCE_SHA" != "$EXPECTED_SOURCE" ]]; then
            echo "main advanced before release authorization"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export SOURCE_SHA
          SOURCE_PARENT="$(git rev-parse HEAD^1)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export SOURCE_PARENT SOURCE_TREE
          git for-each-ref --format='%(refname:strip=2)' refs/tags |
            python3 scripts/release_source.py >> "$GITHUB_OUTPUT"

  release:
    needs: authorize
    if: inputs.dry_run || needs.authorize.outputs.authorized == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@a5ac992d98fc0d0adb299c99876e0fbcc61fd31a # v0.7.15
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # inputs.* is empty for workflow_run events, so automatic runs stay real.
      # The pinned runtime ignores prerelease tags when it looks for a
      # published version. Use its read-only bump plan for this transition.
      dry-run: ${{ inputs.dry_run || needs.authorize.outputs.graduate == 'true' }}
      create-pr: ${{ needs.authorize.outputs.graduate != 'true' }}
      release-branch: automation/release
      required-workflows: CI,Security
      # The threatflux-automation GitHub App opens the release PR. Once it
      # merges and CI and Security pass on main, the App pushes the tag.
      # An App-pushed tag is an ordinary push,
      # so release.yml and docker.yml start from their own `push: tags`
      # triggers and the reusable workflow dispatches nothing
      # (dispatch-on-app-token stays false, which avoids running them twice).
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}

  propose-stable:
    needs: [authorize, release]
    if: needs.authorize.outputs.graduate == 'true' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare proposal from checked main
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE" ]]
          for workflow in ci.yml security.yml; do
            gh run list --workflow "$workflow" --event push --branch main \
              --commit "$EXPECTED_SOURCE" --limit 100 --json attempt,createdAt,startedAt,status,conclusion \
            | jq -e 'length > 0 and length < 100 and all(.[]; .status == "completed")
              and (map(. + {checkTime: (if .attempt == 1 then .createdAt else .startedAt end)})
              | (map(.checkTime) | max) as $latest
              | all(.[] | select(.checkTime == $latest); .conclusion == "success"))' >/dev/null
          done
          python3 scripts/stable_after_prerelease.py >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::The planned stable version is already tagged"
            exit 1
          fi
      - name: Create GitHub App installation token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TF_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open stable version proposal
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ steps.proposal.outputs.branch }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$SOURCE" ]]
          prior="$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)"
          if [[ -z "$prior" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$SOURCE" --silent
            prior="$SOURCE"
          fi
          if [[ "$prior" == "$SOURCE" ]]; then
            gh api graphql --input "$RUNNER_TEMP/stable-proposal.json" \
              | jq -e '.data.createCommitOnBranch.commit |
                .signature.isValid and .author.user.login == "threatflux-automation[bot]"' >/dev/null
          else
            # Recover an interrupted proposal only when the existing signed
            # branch contains the same proposal commit and no other changes.
            [[ "$(git show -s --format=%P "$prior")" == "$SOURCE" ]]
            [[ "$(git diff --name-only "$SOURCE" "$prior")" == $'Cargo.lock\nCargo.toml' ]]
            for file in Cargo.toml Cargo.lock; do
              git show "$prior:$file" | cmp - "$RUNNER_TEMP/stable-proposal-$file"
            done
            gh api "repos/$GITHUB_REPOSITORY/commits/$prior" \
              | jq -e '.commit.verification.verified and .author.login == "threatflux-automation[bot]"' >/dev/null
          fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$SOURCE" ]]
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(release): v$VERSION" --body "Propose the stable release after the published prerelease on $SOURCE."
