name: Auto Release

concurrency:
  # Dry runs get their own group so they never cancel a real release run.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without creating a commit, tag, release or downstream dispatch
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Verify reviewed release source
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.dry_run || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.source.outputs.authorized }}
    steps:
      - name: Checkout protected main
        if: '!inputs.dry_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize the pinned candidate
        id: source
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_APP_ID: ${{ vars.TF_AUTOMATION_APP_ID }}
          EXPECTED_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$AUTOMATION_APP_ID" ]]; then
            echo "::error::Reviewed releases require the ThreatFlux automation App"
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$SOURCE_SHA" != "$EXPECTED_SOURCE" ]]; then
            echo "main advanced before release authorization"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export SOURCE_SHA
          SOURCE_PARENT="$(git rev-parse HEAD^1)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export SOURCE_PARENT SOURCE_TREE
          git for-each-ref --format='%(refname:strip=2)' refs/tags |
            python3 scripts/release_source.py >> "$GITHUB_OUTPUT"

  release:
    needs: authorize
    if: inputs.dry_run || needs.authorize.outputs.authorized == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@c0af79c1d1cbce16cb627d1301942ac668c98beb # v0.7.11
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # inputs.* is empty for workflow_run events, so automatic runs stay real.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      create-pr: true
      release-branch: automation/release
      required-workflows: CI,Security
      # The threatflux-automation GitHub App opens the release PR. Once it
      # merges and CI and Security pass on main, the App pushes the tag.
      # An App-pushed tag is an ordinary push,
      # so release.yml and docker.yml start from their own `push: tags`
      # triggers and the reusable workflow dispatches nothing
      # (dispatch-on-app-token stays false, which avoids running them twice).
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
